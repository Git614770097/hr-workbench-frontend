<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>poster3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e9edf6; font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif; }
  #poster{ width:1080px; height:1440px; position:relative; overflow:hidden;
    background:linear-gradient(180deg,#f4f4ff 0%,#ffffff 52%,#f2f7ff 100%); }
  .blob{ position:absolute; border-radius:50%; }
  .b1{ width:560px; height:560px; right:-160px; top:-170px;
    background:radial-gradient(circle,#e6e2ff 0%,rgba(230,226,255,0) 68%); }
  .b2{ width:500px; height:500px; left:-150px; bottom:-130px;
    background:radial-gradient(circle,#dce9ff 0%,rgba(220,233,255,0) 68%); }
  .wrap{ position:relative; z-index:2; height:100%; padding:56px 72px 0; display:flex; flex-direction:column; }
  .brandrow{ display:flex; justify-content:space-between; align-items:center; }
  .brand{ font-size:30px; font-weight:800; color:#2563eb; letter-spacing:3px; }
  .domain{ font-size:23px; color:#4c5f8f; background:#eef3ff; border:2px solid #d8e3ff;
    padding:8px 24px; border-radius:999px; font-weight:700; }
  .tag{ margin-top:36px; align-self:flex-start; font-size:26px; font-weight:700; color:#fff;
    background:linear-gradient(90deg,#3b82f6,#8b5cf6); padding:10px 30px; border-radius:999px; }
  h1{ margin-top:26px; font-size:64px; line-height:1.32; color:#101d3d; font-weight:900; letter-spacing:2px; }
  .hl{ background:linear-gradient(90deg,#2563eb,#7c3aed); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub{ margin-top:18px; font-size:28px; color:#5a6a8f; font-weight:500; }
  .grid{ margin-top:30px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .gcard{ border-radius:18px; overflow:hidden; border:1px solid #dce5f5; background:#fff;
    box-shadow:0 18px 38px rgba(37,99,235,.12); }
  .gcard img{ display:block; width:100%; height:258px; object-fit:cover; object-position:center top; }
  .gcard img.mid{ object-position:center; }
  .glabel{ display:flex; align-items:center; gap:10px; padding:12px 18px;
    font-size:24px; font-weight:700; color:#2c3f6e; border-top:1px solid #eef2fb; }
  .gdot{ width:12px; height:12px; border-radius:50%; flex:none;
    background:linear-gradient(90deg,#3b82f6,#8b5cf6); }
  .pills{ margin-top:28px; display:flex; gap:16px; }
  .pill{ flex:1; text-align:center; font-size:24px; font-weight:700; color:#2c3f6e;
    background:#fff; border:2px solid #dfe8ff; border-radius:16px; padding:14px 0;
    box-shadow:0 8px 18px rgba(37,99,235,.06); }
  .foot{ margin-top:auto; height:92px; display:flex; align-items:center; justify-content:space-between;
    border-top:2px solid #e6ecf9; }
  .fl{ font-size:26px; font-weight:800; color:#101d3d; letter-spacing:1px; }
  .fr{ font-size:22px; color:#7b88a8; font-weight:600; }
</style>
</head>
<body>
<div id="poster">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <div class="brandrow">
      <div class="brand">HR 工作台</div>
      <div class="domain">hr-work.club</div>
    </div>
    <div class="tag">全部功能 · 真实截图</div>
    <h1>真实界面实拍，<br><span class="hl">每一张都是系统实况</span></h1>
    <div class="sub">不是概念图，是正在运行的系统——数据饱满，开箱即用。</div>
    <div class="grid">
      <div class="gcard">
        <img src="../screenshots/02-pipeline.png" alt="">
        <div class="glabel"><span class="gdot"></span>招聘看板 · 拖拽流转</div>
      </div>
      <div class="gcard">
        <img src="../screenshots/03-funnel.png" class="mid" alt="">
        <div class="glabel"><span class="gdot"></span>招聘漏斗 · 转化分析</div>
      </div>
      <div class="gcard">
        <img src="../screenshots/05-tasks.png" alt="">
        <div class="glabel"><span class="gdot"></span>待办日历 · 到期提醒</div>
      </div>
      <div class="gcard">
        <img src="../screenshots/01-talents.png" alt="">
        <div class="glabel"><span class="gdot"></span>人才库 · AI 解析简历</div>
      </div>
    </div>
    <div class="pills">
      <div class="pill">简历 AI 解析</div>
      <div class="pill">一键导入导出</div>
      <div class="pill">到期自动提醒</div>
      <div class="pill">数据随时带走</div>
    </div>
    <div class="foot">
      <div class="fl">招聘全生命周期管理系统</div>
      <div class="fr">不需要服务器 · 不需要域名 · 打开就能用</div>
    </div>
  </div>
</div>
</body>
</html>
